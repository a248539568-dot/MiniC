name: 功能建议
description: 提议新的桌面管理能力或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明当前操作为什么困难，以及功能服务于什么工作流。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 请描述鼠标按下、移动、释放、取消和异常情况下分别发生什么。
    validations:
      required: true
  - type: textarea
    id: windows
    attributes:
      label: Windows 行为参考
      description: 如果希望与 Explorer 一致，请说明对应的系统操作和结果。
  - type: textarea
    id: safety
    attributes:
      label: 文件与布局影响
      description: 说明是否会移动真实文件、改变视觉归属、窗口拓扑或 Explorer 图标层。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

name: Bug 报告
description: 报告可复现的桌面、收纳盒或 Windows 集成问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题发生在最新版本。不要上传未经脱敏的 layout.json、用户名、桌面完整路径或私人文件名。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: MiniC 版本
      placeholder: 例如 0.58.9
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 与显示环境
      description: 请填写 Windows 版本、显示器数量和缩放比例。
      placeholder: Windows 11 24H2，双显示器，150% / 100%
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options:
        - 安装包
        - 本地 Release 构建
        - 本地 Debug 构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从程序启动开始，写出最短且稳定的操作顺序。
      placeholder: |
        1. 启动 MiniC
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请说明是否有文件移动、重复、消失、崩溃或 Explorer 图标未恢复。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充材料
      description: 可添加已脱敏截图、录屏、自检退出码或日志片段。
  - type: checkboxes
    id: safety
    attributes:
      label: 数据确认
      options:
        - label: 我已确认附件不包含私人桌面路径、用户名或文件名。
          required: true
        - label: 我没有通过删除桌面文件或 layout.json 尝试修复问题。
          required: true

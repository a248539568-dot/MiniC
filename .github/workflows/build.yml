name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore MiniC.sln --configfile NuGet.Publish.Config
      - name: Build Release
        run: dotnet build MiniC.sln --configuration Release --no-restore
      - name: Run regression tests
        run: dotnet test tests/MiniC.Tests/MiniC.Tests.csproj --configuration Release --no-build --no-restore
